<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Campus Events</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 25px #00000018;
        }

        h1 {
            color: #174ea6;
            text-align: center;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #1769d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #104b9b;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769d2;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Admin Login</h1>
        <p>Campus Events Management</p>
        {% if error %}
    <p style="color: red; text-align: center;">
        {{ error }}
    </p>
{% endif %}

        <form action="/admin-login" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username"
                   name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   name="password" required>

            <button type="submit">Login</button>
        </form>

        <a class="back" href="/">Back to Home</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            text-align: center;
            padding: 50px 15px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 35px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 {
            color: #198754;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #1769d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Registration Successful!</h1>

        <p>Thank you, {{ name }}!</p>

        <p>
            Your registration for
            <strong>{{ event }}</strong>
            has been submitted successfully.
        </p>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
